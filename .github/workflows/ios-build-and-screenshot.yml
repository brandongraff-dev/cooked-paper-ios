name: iOS Build and Screenshot Walkthrough

on:
  push:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    # macos-15 is the runner label known to exist and to carry Xcode 26.x (Xcode 26
    # only requires macOS Sequoia 15.6+, not a Tahoe/macOS-26 image). GitHub may since
    # have added a "macos-26" label tracking Apple's OS renumbering, but that isn't
    # confirmed here and an unknown label fails the job before a single log line
    # prints, so macos-15 is the safer default. If the diagnostic step below shows no
    # Xcode 26.x preinstalled, that's the first thing to try changing.
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        # Relative to the repo root. This workflow was originally authored
        # against a monorepo layout (apps/ios/CookedPaper) and then the app was
        # extracted into its own standalone repo, where CookedPaper sits at the
        # root instead — this path was the one thing that didn't get updated in
        # that move, and the first real CI run failed immediately on it. If this
        # workflow is ever copied back into a monorepo, restore the longer path.
        working-directory: CookedPaper
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose available Xcode versions
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: Select Xcode 26.x
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No version-numbered Xcode 26.x install found under /Applications; keeping $(xcode-select -p)"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available | tee simctl-devices.txt

      - name: Select simulator UDID
        run: |
          set -euo pipefail
          DEVICE_LINE=$(grep -m 1 "iPhone" simctl-devices.txt)
          DEVICE_UDID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          echo "Using simulator: $DEVICE_LINE"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      # `xcodebuild test` boots the simulator itself if it isn't already running,
      # then launches the app under test essentially immediately — leaving no time
      # for the simulator's own network/DNS stack to finish settling after a cold
      # boot. Confirmed from a real run: Settings (no network calls) rendered
      # perfectly while Discover/Leaderboard/Portfolio (all fired a request within
      # the first couple of seconds after launch) failed identically with "The
      # request failed." Booting ahead of time and waiting for `bootstatus`, plus a
      # small extra margin, is the standard mitigation for exactly this class of
      # iOS Simulator CI flakiness.
      - name: Pre-boot simulator and let networking settle
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          sleep 10

      # The pre-boot settle time above did NOT fix the same failure on a prior run,
      # which means "simulator network still warming up" was the wrong diagnosis,
      # or at least not the only one. This step answers a narrower question before
      # spending another full build+test cycle guessing further: can the RUNNER
      # itself (outside the simulator entirely) reach the production API at all?
      # If this fails, the problem is network/DNS/firewall/rate-limiting above the
      # simulator layer; if it succeeds, the problem is specific to how the
      # simulator's network stack or the app's own request is behaving.
      - name: Diagnose API reachability from the runner
        continue-on-error: true
        run: |
          echo "--- DNS resolution ---"
          host totem-api-production-0323.up.railway.app || nslookup totem-api-production-0323.up.railway.app || true
          echo "--- curl -v to /health ---"
          curl -v --max-time 15 https://totem-api-production-0323.up.railway.app/health || true

      - name: Build and test (unit tests + UI screenshot walkthrough)
        run: |
          xcodebuild test \
            -project CookedPaper.xcodeproj \
            -scheme CookedPaper \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundle
          path: CookedPaper/TestResults.xcresult
          if-no-files-found: warn

      - name: Extract screenshots from xcresult
        if: always()
        run: |
          set -euo pipefail
          mkdir -p screenshots
          if [ ! -e TestResults.xcresult ]; then
            echo "TestResults.xcresult not found; the build/test step didn't get far enough to produce one."
            exit 0
          fi

          n=0

          # xcresulttool's CLI was rewritten in Xcode 16 and its exact export flags
          # have kept moving across point releases, so this is a best-effort primary
          # path — the raw `find` below is the safety net, not an afterthought.
          if xcrun xcresulttool export attachments --path TestResults.xcresult --output-path exported-attachments > xcresulttool-export.log 2>&1; then
            echo "xcresulttool export attachments succeeded"
          else
            echo "xcresulttool export attachments failed on this Xcode version (see xcresulttool-export.log); relying on the find fallback below"
          fi

          if [ -d exported-attachments ]; then
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              cp "$f" "screenshots/$(printf '%03d' "$n")-$(basename "$f")"
            done < <(find exported-attachments -name '*.png' -print0)
          fi

          # Only fall back to raw extraction if the structured export above found
          # nothing — otherwise every screenshot would be copied twice under two
          # different names, since both paths reach the same underlying PNGs.
          if [ "$n" -eq 0 ]; then
            echo "No PNGs from xcresulttool export; falling back to a raw scan of the bundle"
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              cp "$f" "screenshots/$(printf '%03d' "$n")-$(basename "$f")"
            done < <(find TestResults.xcresult -name '*.png' -print0)
          fi

          echo "Collected $n screenshot PNG(s) into screenshots/"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: CookedPaper/screenshots/*.png
          if-no-files-found: warn
