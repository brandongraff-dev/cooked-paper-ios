name: CookedPaper

# Generated with XcodeGen (https://github.com/yonaskolb/XcodeGen) because this project
# was scaffolded from a machine with no Xcode. Install XcodeGen (`brew install
# xcodegen`) and run `xcodegen generate` in this directory to produce
# CookedPaper.xcodeproj — do not hand-edit a checked-in .xcodeproj instead, this file
# is the source of truth and the .xcodeproj is gitignored.

options:
  bundleIdPrefix: app.cooked
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  # XcodeGen only writes a scheme's StoreKit Configuration into LaunchAction, never
  # TestAction (see the `test:` scheme block below) — so the UI test, which runs
  # under `xcodebuild test`, would otherwise see an empty product catalog and never
  # get past the paywall. This clones whatever XcodeGen already generated correctly
  # for LaunchAction into TestAction after every `xcodegen generate`, rather than
  # hand-writing the StoreKitConfigurationFileReference XML (its `identifier` path
  # format is easy to get subtly wrong without a real Xcode to check against).
  postGenCommand: python3 Scripts/attach-storekit-to-test-action.py

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "" # owner-provided: your Apple Developer Team ID (see README)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # Real-time paper-portfolio prices + PnL: apps/api's /paper Socket.IO namespace.
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  # Sign in with Google (ID token with a server-issued nonce; the API verifies it).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0 # first release with sign-in `nonce:`

targets:
  CookedPaper:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Includes PrivacyInfo.xcprivacy (the App Store privacy manifest), which
      # XcodeGen puts in the Copy Bundle Resources phase like any other file type
      # it has no compile rule for (PracticeReplay.json rides the same rule).
      - path: Resources
    resources:
      - path: StoreKit/Products.storekit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Cooked Paper
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: ""
        CFBundleURLTypes:
          # cookedpaper://token/<mint> deep links (see DeepLinkRouter).
          - CFBundleURLSchemes:
              - cookedpaper
          # Google sign-in's callback: the iOS client id, reversed.
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        # The iOS OAuth client id from Google Cloud Console (see build settings below).
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Which API this build talks to (APIConfig.baseURL); set per configuration
        # below. Anything missing or malformed falls back to production.
        COOKED_API_BASE_URL: $(COOKED_API_BASE_URL)
        # XcodeGen's default Info.plist still says armv7, which no iOS 17 device is.
        UIRequiredDeviceCapabilities:
          - arm64
        # Plain-http to localhost / *.local only, so Debug can point at an API on
        # your Mac. Everything else (including production) stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/CookedPaper.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Push Notifications. Expanded per configuration from APS_ENVIRONMENT below:
        # "development" (APNs sandbox) for Debug, "production" for Release.
        aps-environment: $(APS_ENVIRONMENT)
        # Universal links: https://cooked.trade/d/<code> and /l/<code> (duel and
        # league invites) open the app instead of Safari and arrive in
        # DeepLinkRouter through .onOpenURL. iOS verifies each host against
        # https://<host>/.well-known/apple-app-site-association, served by the web
        # app (apps/web in cooked.trade) once APPLE_TEAM_ID is set there. Both hosts
        # are listed because the apex redirects to www and Apple checks each
        # separately (and does not follow redirects for that file).
        com.apple.developer.associated-domains:
          - applinks:cooked.trade
          - applinks:www.cooked.trade
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
        # Associated Domains (Xcode still keys this capability by its old name).
        com.apple.SafariKeychain:
          enabled: 1
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
          # To run Debug against a local or staging API, change this (e.g.
          # http://localhost:3000 for an API on the same Mac as the simulator).
          # Leave the scheme in place; anything malformed falls back to production.
          COOKED_API_BASE_URL: https://api.cooked.trade
        Release:
          APS_ENVIRONMENT: production
          COOKED_API_BASE_URL: https://api.cooked.trade
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cooked.paper
        PRODUCT_NAME: CookedPaper
        TARGETED_DEVICE_FAMILY: "1" # iPhone only, matching the RN app's supportsTablet: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Owner-provided (see README): fill in from Google Cloud Console →
        # Credentials → iOS client (bundle id app.cooked.paper). Until then the
        # Google button says it isn't configured.
        GOOGLE_IOS_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
        GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.REPLACE_ME"
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: GoogleSignIn
        product: GoogleSignIn

  CookedPaperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CookedPaper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  CookedPaperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CookedPaper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CookedPaper:
    build:
      targets:
        CookedPaper: all
        CookedPaperTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Products.storekit
    test:
      config: Debug
      # No storeKitConfiguration key here: XcodeGen's Scheme.Test model has no such
      # field (only Scheme.Run does, confirmed against the XcodeGen master source on
      # 2026-09-27) — the key would parse but be silently dropped. The
      # `postGenCommand` above patches this back in after generation; if the UI
      # test's paywall step ever sees an empty product catalog, check that script
      # and this comment first.
      targets:
        - CookedPaperTests
        - CookedPaperUITests
    archive:
      config: Release
